[mypy]
plugins = pydantic.mypy
python_version = 3.12
ignore_missing_imports = False
warn_unused_configs = True

[mypy-pysus.*]
ignore_missing_imports = True

[mypy-statsforecast.*]
ignore_missing_imports = True

[mypy-prophet.*]
ignore_missing_imports = True

[mypy-sklearn.*]
ignore_missing_imports = True

[mypy-pandas.*]
ignore_missing_imports = True

[mypy-psycopg2.*]
ignore_missing_imports = True

[mypy-pyreaddbc.*]
ignore_missing_imports = True
