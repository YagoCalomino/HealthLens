version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: healthlens
      POSTGRES_PASSWORD: healthlens
      POSTGRES_DB: healthlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthlens"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    command: alembic upgrade head
    restart: on-failure

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      SAMPLE_MODE: "false"
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:

