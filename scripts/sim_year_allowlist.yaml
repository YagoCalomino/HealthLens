# SIM completeness allowlist.
#
# Each entry under `known_absent` is a [UF, ano] pair confirmed genuinely
# absent from the DataSUS DuckLake catalog -- not a pipeline bug, not a
# transient network failure, and not a shortcut to make
# `scripts/assert_sim_completeness.py` pass without investigation.
#
# Before adding an entry:
#   1. Confirm the absence with `python scripts/scan_sim_catalog.py` (or an
#      equivalent manual catalog query) for that exact UF/year.
#   2. Add the entry below with an inline comment recording HOW and WHEN the
#      absence was confirmed (date + method), e.g.:
#        - [SP, 2005]  # confirmed absent via scan_sim_catalog.py, 2026-08-01
#   3. Never add an entry "just to make the check pass" -- an unexplained
#      entry here defeats the entire purpose of the completeness assertion
#      (masking a real ingestion gap instead of surfacing it).
#
# The SIM 2024 re-ingestion started with 373 of 405 SIM_{uf}_{ano}.parquet
# files already cached locally but did NOT pre-populate this list --
# whether the 32 uncached combos are genuine catalog absences or simply
# never-downloaded units is exactly what the full `make full` run
# resolves. The operator populates this list after that run, only for
# combos scan_sim_catalog.py confirms are absent from the catalog.
