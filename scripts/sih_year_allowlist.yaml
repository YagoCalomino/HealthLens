  # Confirmed via the operator's full 27x15 `make full` run; files present for
  # the years below are SP-schema (36 cols, no IDENT) -- correctly skipped by
  # _fetch_sih_rd's filename-prefix filter, not an ingestion failure. See
  # docs/pysus-270-spike-findings.md "Full-scale re-ingestion -- catalog
  # coverage gaps" for details. Confirmed 2026-07-25.
  - [SP, 2011]
  - [SP, 2012]
