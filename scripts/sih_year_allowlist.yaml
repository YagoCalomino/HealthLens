# SIH completeness allowlist.
#
# Each entry under `known_absent` is a [UF, ano] pair confirmed genuinely
# absent from the DataSUS DuckLake catalog -- not a pipeline bug, not a
# transient network failure, and not a shortcut to make
# `scripts/assert_sih_completeness.py` pass without investigation.
#
# Before adding an entry:
#   1. Confirm the absence with `python scripts/scan_sih_catalog.py` (or an
#      equivalent manual catalog query) for that exact UF/year.
#   2. Add the entry below with an inline comment recording HOW and WHEN the
#      absence was confirmed (date + method), e.g.:
#        - [SP, 2005]  # confirmed absent via scan_sih_catalog.py, 2026-08-01
#   3. Never add an entry "just to make the check pass" -- an unexplained
#      entry here defeats the entire purpose of the completeness assertion
#      (masking a real ingestion gap instead of surfacing it).
#
# The pipeline does not scan the full 27x15 grid itself (the full
# re-ingestion is an operator-run step), so the list started empty. The operator
# populates it after their real `make full` run, if the catalog genuinely has
# no RD files for specific UF/year combos.
known_absent:
